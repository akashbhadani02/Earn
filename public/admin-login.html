<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="/api/branding/icon?v=1&size=32" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="/api/branding/icon?v=1&size=192">
    <link rel="apple-touch-icon" sizes="180x180" href="/api/branding/icon?v=1&size=180">
    <link rel="manifest" href="/admin-manifest.webmanifest?v=admin-v1">
    <meta name="theme-color" content="#667eea">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
overflow:hidden;
}

body::before{
content:"";
position:absolute;
width:450px;
height:450px;
background:rgba(255,255,255,.08);
border-radius:50%;
top:-150px;
left:-120px;
filter:blur(20px);
}

body::after{
content:"";
position:absolute;
width:350px;
height:350px;
background:rgba(255,255,255,.06);
border-radius:50%;
bottom:-120px;
right:-100px;
filter:blur(20px);
}

.login-box{
position:relative;
width:380px;
padding:40px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.2);
border-radius:20px;
box-shadow:0 20px 45px rgba(0,0,0,.35);
z-index:2;
animation:fadeIn .8s ease;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.logo{
font-size:65px;
text-align:center;
margin-bottom:10px;
}

h2{
text-align:center;
color:#fff;
margin-bottom:30px;
font-size:30px;
letter-spacing:1px;
}

input{
width:100%;
padding:15px;
margin-bottom:18px;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,.15);
color:#fff;
font-size:16px;
transition:.3s;
}

input::placeholder{
color:#ddd;
}

input:focus{
background:rgba(255,255,255,.22);
box-shadow:0 0 12px #60a5fa;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#2563eb,#3b82f6);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
background:linear-gradient(90deg,#1d4ed8,#2563eb);
box-shadow:0 10px 25px rgba(37,99,235,.45);
}

.footer{
margin-top:20px;
text-align:center;
color:#ddd;
font-size:14px;
}

@media(max-width:450px){

.login-box{
width:90%;
padding:30px 20px;
}

h2{
font-size:25px;
}

.logo{
font-size:55px;
}

}


.app-switch-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.app-card{display:flex;flex-direction:column;gap:7px}
.app-switch-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 12px;border-radius:10px;border:0;background:linear-gradient(90deg,#1d4ed8,#2563eb);color:#fff!important;text-decoration:none;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 8px 20px rgba(37,99,235,.28);transition:.2s;width:100%;box-sizing:border-box}
.app-switch-btn:hover{background:linear-gradient(90deg,#1e40af,#1d4ed8);transform:translateY(-2px);box-shadow:0 10px 25px rgba(37,99,235,.38)}
.app-switch-btn.install-link{background:rgba(255,255,255,.96);color:#1d4ed8!important;border:1px solid rgba(37,99,235,.35);box-shadow:none}
.app-switch-btn.install-link:hover{background:#fff}
@media(max-width:430px){.app-switch-grid{grid-template-columns:1fr}}
</style>


<style id="cross-app-and-anti-inspect-style">
.cross-app-btn{position:fixed;right:14px;top:14px;z-index:2147483000;display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:12px;text-decoration:none;font:700 13px/1.2 Arial,sans-serif;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.35)}
.cross-app-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
@media(max-width:600px){.cross-app-btn{right:8px;top:8px;padding:7px 10px;font-size:11px;border-radius:10px}}
</style>
</head>

<body>

<div class="login-box">

<div class="logo">🛡️</div>

<h2>Admin Login</h2>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<div class="app-switch-grid">
  <div class="app-card">
    <a class="app-switch-btn" href="/admin-login.html">🛡️ Admin App</a>
    <button type="button" id="adminInstallBtn" class="app-switch-btn install-link">📲 Install Admin App</button>
  </div>
  <div class="app-card">
    <a class="app-switch-btn" href="/login.html">🎓 Student App</a>
    <button type="button" id="studentInstallBtn" class="app-switch-btn install-link">📲 Install Student App</button>
  </div>
</div>

<div class="footer">
Secure Admin Panel
</div>

</div>

<script>

async function login(){

const res = await fetch("/api/admin/login",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username:username.value,

password:password.value

})

});

const data = await res.json();

if(data.success){

localStorage.setItem("adminToken",data.token);

location.href="admin.html";

}else{

alert(data.message);

}

}

</script>

<script>
let adminDeferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();adminDeferredPrompt=e;});
function openInstallPage(url){ window.location.href=url+'?install=1'; }
document.addEventListener('DOMContentLoaded',()=>{
  const ab=document.getElementById('adminInstallBtn');
  const sb=document.getElementById('studentInstallBtn');
  if(ab) ab.addEventListener('click',async()=>{if(!adminDeferredPrompt)return; adminDeferredPrompt.prompt(); await adminDeferredPrompt.userChoice; adminDeferredPrompt=null;});
  if(sb) sb.addEventListener('click',()=>openInstallPage('/login.html'));
  if(new URLSearchParams(location.search).get('install')==='1' && adminDeferredPrompt){setTimeout(()=>ab?.click(),500);}
});
</script>

<script id="globalBrandingClient">
(function(){
  const FALLBACK='/aducate.png';
  let currentVersion=null;
  function setLink(rel, href, sizes){
    let el=document.querySelector(`link[rel="${rel}"]${sizes?`[sizes="${sizes}"]`:''}`);
    if(!el){ el=document.createElement('link'); el.rel=rel; if(sizes) el.sizes=sizes; document.head.appendChild(el); }
    el.href=href;
  }
  function applyBranding(data){
    const version=Number(data?.version||0);
    if(currentVersion===version && document.documentElement.dataset.brandingReady==='1') return;
    currentVersion=version;
    document.documentElement.dataset.brandingReady='1';
    const src=`/api/branding/icon?v=${version}&size=512&t=${Date.now()}`;
    document.querySelectorAll('[data-brand-logo]').forEach(img=>{ img.src=src; img.alt='Aducate Logo'; });
    setLink('icon', src, '192x192');
    setLink('apple-touch-icon', src, '180x180');
    const manifest=document.querySelector('link[rel="manifest"]'); if(manifest) manifest.href=`/admin-manifest.webmanifest?v=admin-v2&brand=${version}&t=${Date.now()}`;
    // Broadcast the new branding to every open tab/window immediately.
    try { localStorage.setItem('aducate-branding-version', String(version)); } catch(e) {}
    try { if ('BroadcastChannel' in window) { window.__aducateBrandChannel = window.__aducateBrandChannel || new BroadcastChannel('aducate-branding'); window.__aducateBrandChannel.postMessage({type:'BRANDING_UPDATED',version}); } } catch(e) {}
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistration('/').then(reg=>reg?.active?.postMessage({type:'BRANDING_UPDATED',version})).catch(()=>{});
  }
  async function refresh(){
    try{ const r=await fetch('/api/branding?_='+Date.now(),{cache:'no-store'}); const d=await r.json(); if(d.success) applyBranding(d); }catch(e){}
  }
  window.refreshGlobalBranding=refresh;
  refresh();
  setInterval(refresh,3000);
})();
</script>

<script src="/mobile-branding.js" defer></script>
<script id="anti-inspect-protection">
(function(){
  // Discourage common browser DevTools/inspect shortcuts. This cannot override browser-level controls.
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); }, {capture:true});
  document.addEventListener('dragstart', function(e){ e.preventDefault(); }, {capture:true});
  document.addEventListener('keydown', function(e){
    var k=(e.key||'').toLowerCase();
    var blocked = k==='f12' ||
      (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(k)) ||
      (e.ctrlKey && k==='u') ||
      (e.metaKey && e.altKey && ['i','j','c'].includes(k));
    if(blocked){ e.preventDefault(); e.stopPropagation(); return false; }
  }, {capture:true});
})();
</script>
</body>

</html>
