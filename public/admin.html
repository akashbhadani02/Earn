<!DOCTYPE html>
<html>

<head>

    <title>Admin Panel</title>


<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;

    font-family: "Segoe UI", Arial, sans-serif;

    background:
        radial-gradient(
            circle at top left,
            rgba(37, 99, 235, 0.22),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(139, 92, 246, 0.18),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #020617,
            #0f172a,
            #1e293b
        );

    color: #ffffff;
    padding: 25px;
}


/* =====================================================
   HEADER
===================================================== */

body > div:first-child {
    width: 100%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 20px 24px;

    margin-bottom: 25px !important;

    background: rgba(255, 255, 255, 0.07);

    border: 1px solid rgba(255, 255, 255, 0.12);

    border-radius: 18px;

    backdrop-filter: blur(15px);

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.25);
}

body > div:first-child h2 {
    margin: 0;
    font-size: 26px;
    color: #ffffff;
}

body > div:first-child button {
    background:
        linear-gradient(
            135deg,
            #ef4444,
            #b91c1c
        ) !important;

    color: white !important;

    padding: 11px 25px !important;

    border-radius: 10px !important;

    font-weight: 700;

    border: none !important;

    cursor: pointer;
}


/* =====================================================
   HEADINGS
===================================================== */

h2 {
    margin: 30px 0 18px;

    font-size: 25px;

    color: #f8fafc;
}

h2::after {
    content: "";

    display: block;

    width: 60px;

    height: 4px;

    margin-top: 8px;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #38bdf8,
            #6366f1
        );
}


/* =====================================================
   DASHBOARD CARDS
===================================================== */

.cards {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 20px;

    margin-bottom: 35px;
}

.card {
    min-width: 0;

    min-height: 145px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    position: relative;

    overflow: hidden;

    padding: 25px;

    border-radius: 20px;

    background:
        rgba(255, 255, 255, 0.07);

    border:
        1px solid rgba(255, 255, 255, 0.12);

    backdrop-filter: blur(15px);

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.25);

    transition: 0.3s;
}

.card:hover {
    transform: translateY(-6px);

    box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.4);
}

.card h3 {
    font-size: 16px;

    color: #cbd5e1;

    margin-bottom: 10px;
}

.card h1 {
    font-size: 35px;

    font-weight: 800;
}

.card:nth-child(1) h1 {
    color: #38bdf8;
}

.card:nth-child(2) h1 {
    color: #22c55e;
}

.card:nth-child(3) h1 {
    color: #fbbf24;
}

.card:nth-child(4) h1 {
    color: #f87171;
}


/* =====================================================
   SEARCH
===================================================== */

#search {
    width: 100%;

    max-width: 450px;

    padding: 14px 18px;

    margin: 5px 0 20px;

    border: 2px solid #e2e8f0;

    outline: none;

    border-radius: 12px;

    background: #ffffff;

    color: #111827;

    font-size: 16px;

    box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.15);
}

#search:focus {
    border-color: #38bdf8;

    box-shadow:
        0 0 0 4px
        rgba(56, 189, 248, 0.15);
}


/* =====================================================
   TABLE
===================================================== */

table {
    width: 100%;

    max-width: 100%;

    border-collapse: separate;

    border-spacing: 0;

    table-layout: auto;

    margin-bottom: 40px;

    background: #ffffff;

    color: #111827;

    border-radius: 16px;

    box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.30);
}


/* =====================================================
   TABLE HEADER
===================================================== */

thead {
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #4f46e5
        );

    color: #ffffff;
}

th {
    padding: 15px 12px;

    font-size: 13px;

    font-weight: 700;

    text-align: left;

    white-space: normal;

    word-break: break-word;
}


/* =====================================================
   TABLE BODY
===================================================== */

td {
    padding: 14px 12px;

    font-size: 13px;

    border-bottom:
        1px solid #e5e7eb;

    vertical-align: middle;

    word-break: break-word;

    overflow-wrap: anywhere;
}

tbody tr:nth-child(even) {
    background: #f8fafc;
}

tbody tr:hover {
    background: #eff6ff;
}


/* =====================================================
   WITHDRAW PAYMENT DETAILS
===================================================== */

#withdrawTable td:nth-child(5) {
    min-width: 180px;

    max-width: 260px;

    white-space: normal;

    line-height: 1.6;

    font-size: 12px;

    background: #f8fafc;
}

#withdrawTable td:nth-child(5) b {
    color: #1e293b;
}


/* =====================================================
   AMOUNT
===================================================== */

#withdrawTable td:nth-child(3) {
    color: #16a34a;

    font-size: 15px;

    font-weight: 800;

    white-space: nowrap;
}


/* =====================================================
   STATUS
===================================================== */

#withdrawTable td:nth-child(6) {
    text-align: center;
}

#withdrawTable td:nth-child(6) strong {
    display: inline-block;

    padding: 6px 12px;

    border-radius: 20px;

    background: #fef3c7;

    color: #92400e;

    font-size: 11px;

    font-weight: 800;

    white-space: nowrap;
}


/* =====================================================
   ACTION BUTTONS
===================================================== */

button {
    border: none;

    padding: 8px 12px;

    margin: 3px;

    border-radius: 8px;

    color: white;

    cursor: pointer;

    font-size: 12px;

    font-weight: 700;

    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 5px 15px
        rgba(0, 0, 0, 0.2);
}


/* EDIT */

button[onclick^="editWallet"] {
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );
}


/* DELETE USER */

button[onclick^="deleteUser"] {
    background:
        linear-gradient(
            135deg,
            #ef4444,
            #dc2626
        );
}


/* UNBLOCK */

button[onclick^="unblockUser"] {
    background:
        linear-gradient(
            135deg,
            #22c55e,
            #15803d
        ) !important;
}


/* APPROVE */

button[onclick^="approveWithdraw"] {
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        ) !important;
}


/* REJECT */

button[onclick^="rejectWithdraw"] {
    background:
        linear-gradient(
            135deg,
            #ef4444,
            #dc2626
        ) !important;
}


/* MARK PAID */

button[onclick^="markWithdrawPaid"] {
    background:
        linear-gradient(
            135deg,
            #16a34a,
            #15803d
        ) !important;
}


/* DELETE WITHDRAW */

button[onclick^="deleteWithdraw"] {
    background:
        linear-gradient(
            135deg,
            #64748b,
            #334155
        ) !important;
}


/* =====================================================
   EMPTY MESSAGE
===================================================== */

#withdrawTable td[colspan],
#userTable td[colspan] {
    text-align: center;

    padding: 30px;

    color: #64748b;

    font-weight: 700;
}


/* =====================================================
   TABLET
===================================================== */

@media (max-width: 1000px) {

    body {
        padding: 18px;
    }

    .cards {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    table {
        font-size: 12px;
    }

    th,
    td {
        padding: 10px 8px;
    }

}


/* =====================================================
   MOBILE - NO HORIZONTAL SCROLL
===================================================== */

@media (max-width: 700px) {

    body {
        padding: 10px;

        overflow-x: hidden;
    }


    /* HEADER */

    body > div:first-child {
        flex-direction: column !important;

        align-items: stretch !important;

        gap: 12px;

        padding: 16px;

        margin-bottom: 20px !important;
    }

    body > div:first-child h2 {
        text-align: center;

        font-size: 22px;
    }

    body > div:first-child button {
        width: 100%;
    }


    /* CARDS */

    .cards {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 12px;
    }

    .card {
        min-height: 115px;

        padding: 15px;
    }

    .card h3 {
        font-size: 13px;

        text-align: center;
    }

    .card h1 {
        font-size: 27px;
    }


    /* SEARCH */

    #search {
        width: 100%;

        max-width: 100%;
    }


    /* TABLE */

    table {
        width: 100%;

        table-layout: fixed;

        border-radius: 12px;

        overflow: hidden;
    }

    th,
    td {
        padding: 8px 5px;

        font-size: 10px;

        word-break: break-word;

        overflow-wrap: anywhere;
    }


    /* WITHDRAW PAYMENT DETAILS */

    #withdrawTable td:nth-child(5) {
        min-width: 0;

        max-width: none;

        font-size: 9px;

        line-height: 1.4;
    }


    /* ACTION */

    #withdrawTable td:nth-child(10) {
        text-align: center;
    }

    #withdrawTable td:nth-child(10) button {
        display: block;

        width: 100%;

        margin: 3px 0;

        padding: 6px 3px;

        font-size: 9px;
    }


    /* DATE */

    #withdrawTable td:nth-child(8),
    #withdrawTable td:nth-child(9) {
        font-size: 9px;

        word-break: break-word;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 480px) {

    body {
        padding: 7px;
    }

    .cards {
        grid-template-columns: 1fr 1fr;

        gap: 8px;
    }

    .card {
        min-height: 100px;

        padding: 10px;

        border-radius: 12px;
    }

    .card h3 {
        font-size: 11px;
    }

    .card h1 {
        font-size: 22px;
    }

    h2 {
        font-size: 19px;

        margin: 20px 0 12px;
    }

    th,
    td {
        padding: 6px 3px;

        font-size: 8px;
    }

    #withdrawTable td:nth-child(5) {
        font-size: 8px;
    }

    #withdrawTable td:nth-child(10) button {
        font-size: 8px;

        padding: 5px 2px;
    }

}


/* =====================================================
   REMOVE HORIZONTAL SCROLLBAR
===================================================== */

html,
body {
    max-width: 100%;

    overflow-x: hidden;
}

</style>

</head>

<body>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2>Admin Dashboard</h2>

        <button onclick="logout()" style="background:red;color:white;border:none;padding:10px 18px;border-radius:6px;">
            Logout
        </button>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Users</h3>
            <h1 id="totalUsers">0</h1>
        </div>

        <div class="card">
            <h3>Total Wallet</h3>
            <h1 id="wallet">0</h1>
        </div>

        <div class="card">
            <h3>Total Earn</h3>
            <h1 id="earn">0</h1>
        </div>

        <div class="card">
            <h3>Pending Withdraw</h3>
            <h1 id="withdraw">0</h1>
        </div>

    </div>
    <h2>Withdraw Requests</h2>

    <table>

        <thead>

            <tr>

                <th>Name</th>
                <th>Mobile</th>
                <th>Amount</th>
                <th>Payment Method</th>
                <th>Payment Details</th>
                <th>Status</th>
                <th>Transaction ID</th>
                <th>Date</th>
                <th>Paid Date</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="withdrawTable">

        </tbody>

    </table>

    <input id="search" placeholder="Search User" onkeyup="searchUser()">

    <h2>All Users</h2>

    <table>

        <thead>

            <tr>

                <th>Name</th>
                <th>Mobile</th>
                <th>Status</th>
                <th>Wallet</th>
                <th>Total Earn</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="userTable">

        </tbody>

    </table>

    <script>

        const token = localStorage.getItem("adminToken");

        if (!token) {

            location.href = "admin-login.html";

        }

        let allUsers = [];

        //==========================
        // Dashboard
        //==========================

        async function loadDashboard() {

            const res = await fetch("/api/admin/dashboard", {

                headers: {

                    Authorization: "Bearer " + token

                }

            });

            const data = await res.json();

            if (!data.success) {

                alert(data.message);

                return;

            }

            document.getElementById("totalUsers").innerHTML = data.totalUsers;
            document.getElementById("wallet").innerHTML =
                Number(data.totalWallet).toFixed(2);

            document.getElementById("earn").innerHTML =
                Number(data.totalEarn).toFixed(2);
            document.getElementById("withdraw").innerHTML =
                Number(data.pendingWithdraw).toFixed(2);

        }

        //==========================
        // Load Users
        //==========================

        async function loadUsers() {

            const res = await fetch("/api/admin/users", {

                headers: {

                    Authorization: "Bearer " + token

                }

            });

            const data = await res.json();

            if (!data.success) {

                alert(data.message);

                return;

            }

            allUsers = data.users || [];

            showUsers(allUsers);

        }

        //==========================
        // Show Users
        //==========================

        //==========================
        // Show Users
        //==========================

        function showUsers(users) {

            let html = "";

            users.forEach(user => {

                // Online / Offline Status
                const statusHTML = user.isOnline
                    ? `<span style="
                color: #16a34a;
                font-weight: bold;
                background: #dcfce7;
                padding: 5px 10px;
                border-radius: 20px;
                display: inline-block;
              ">🟢 Online</span>`
                    : `<span style="
                color: #dc2626;
                font-weight: bold;
                background: #fee2e2;
                padding: 5px 10px;
                border-radius: 20px;
                display: inline-block;
              ">🔴 Offline</span>`;

                html += `

<tr>

<td>${user.name}</td>

<td>${user.mobile}</td>

<td>
${user.isBlocked
                        ? '<span style="color:red;font-weight:bold;">🚫 Blocked</span>'
                        : statusHTML}
</td>

<td>${Number(user.wallet || 0).toFixed(2)}</td>

<td>${Number(user.totalEarn || 0).toFixed(2)}</td>

<td>

<button onclick="editWallet('${user._id}',${user.wallet || 0})">
Edit
</button>

<button onclick="deleteUser('${user._id}')">
Delete
</button>

${user.isBlocked ? `
<button onclick="unblockUser('${user._id}')"
style="background:#16a34a;">
Unblock
</button>
` : ""}

</td>

</tr>

`;

            });

            document.getElementById("userTable").innerHTML = html;

        }

        //==========================
        // Search
        //==========================

        function searchUser() {

            const value = document
                .getElementById("search")
                .value
                .toLowerCase();

            const filtered = allUsers.filter(user => {

                return user.name.toLowerCase().includes(value)
                    ||
                    user.mobile.includes(value);

            });

            showUsers(filtered);

        }

        //==========================
        // Edit Wallet
        //==========================

        async function editWallet(id, currentWallet) {

            const amount = prompt("Enter New Wallet", currentWallet);

            if (amount == null) return;
            if (isNaN(amount)) {

                alert("Enter Valid Number");

                return;

            }

            await fetch("/api/admin/wallet/" + id, {

                method: "PUT",

                headers: {

                    "Content-Type": "application/json",

                    Authorization: "Bearer " + token

                },

                body: JSON.stringify({

                    wallet: Number(amount)

                })

            });

            loadUsers();

            loadDashboard();

        }

        //==========================
        // Delete User
        //==========================

        async function deleteUser(id) {

            if (!confirm("Delete User?")) return;

            await fetch("/api/admin/user/" + id, {

                method: "DELETE",

                headers: {

                    Authorization: "Bearer " + token

                }

            });

            loadUsers();

            loadDashboard();

        }

        async function loadWithdraws() {

            const res = await fetch(

                "/api/admin/withdraws",

                {

                    headers: {

                        Authorization: "Bearer " + token

                    }

                }

            );

            const data = await res.json();

            if (!res.ok || !data.success) {
                console.error("Withdraw Load Error:", data.message);
                document.getElementById("withdrawTable").innerHTML = `
                    <tr><td colspan="10">${data.message || "Failed to load withdraw requests"}</td></tr>
                `;
                return;
            }

            let html = "";

            const list = data.withdraws || [];

            if (list.length === 0) {
                document.getElementById("withdrawTable").innerHTML = `
                    <tr><td colspan="10">No Withdraw Requests Found</td></tr>
                `;
                return;
            }

            list.forEach(w => {

                html += `

<tr>

<td>${w.name}</td>

<td>${w.mobile}</td>

<td>₹${Number(w.amount || 0).toFixed(2)}</td>

<td>
    ${w.paymentMethod || "-"}
</td>

<td>

${w.paymentMethod === "UPI"
                        ? `
<b>UPI:</b><br>
${w.upiId || "-"}
`
                        : `
<b>Bank:</b> ${w.bankName || "-"}<br>

<b>Holder:</b> ${w.accountHolderName || "-"}<br>

<b>Account:</b> ${w.accountNumber || "-"}<br>

<b>IFSC:</b> ${w.ifscCode || "-"}
`
                    }

</td>

<td>
<strong>${w.status}</strong>
</td>   

<td>
    ${w.transactionId || "-"}
</td>

<td>
    ${w.date
                        ? new Date(w.date).toLocaleString()
                        : "-"
                    }
</td>

<td>
    ${w.paidAt
                        ? new Date(w.paidAt).toLocaleString()
                        : "-"
                    }
</td>

<td>

${w.status === "Pending" ? `
<button
    onclick="approveWithdraw('${w.userId}','${w.requestId}')"
    style="background:#2563eb;">
    Approve
</button>

<button
    onclick="rejectWithdraw('${w.userId}','${w.requestId}')"
    style="background:#ef4444;">
    Reject
</button>
` : ""}

${w.status === "Approved" ? `
<button
    onclick="markWithdrawPaid('${w.userId}','${w.requestId}')"
    style="background:#16a34a;">
    Mark Paid
</button>
` : ""}

<button
    onclick="deleteWithdraw('${w.userId}','${w.requestId}')"
    style="background:#6b7280;">
    Delete
</button>

</td>

</tr>

`;

            });

            document.getElementById("withdrawTable").innerHTML = html;

        }

        async function approveWithdraw(userId, requestId) {

            if (!confirm("Approve this withdraw request?")) return;

            const res = await fetch(
                "/api/admin/withdraw/approve/" + userId + "/" + requestId,
                {
                    method: "PUT",
                    headers: {
                        Authorization: "Bearer " + token
                    }
                }
            );

            const data = await res.json();

            if (!res.ok || !data.success) {
                alert(data.message || "Approve failed");
                return;
            }

            await loadWithdraws();
            await loadDashboard();
        }

        async function rejectWithdraw(userId, requestId) {

            if (!confirm("Reject this withdraw request? Amount will be refunded to student wallet.")) return;

            const res = await fetch(
                "/api/admin/withdraw/reject/" + userId + "/" + requestId,
                {
                    method: "PUT",
                    headers: {
                        Authorization: "Bearer " + token
                    }
                }
            );

            const data = await res.json();

            if (!res.ok || !data.success) {
                alert(data.message || "Reject failed");
                return;
            }

            await loadWithdraws();
            await loadDashboard();
        }

        //==========================
        // Logout
        //==========================

        function logout() {

            if (!confirm("Are you sure you want to logout?")) return;

            localStorage.removeItem("adminToken");

            location.href = "admin-login.html";

        }

        //==========================
        // Mark Withdraw as Paid
        //==========================

        async function markWithdrawPaid(userId, requestId) {

            const transactionId = prompt(
                "Enter Payment Transaction ID:"
            );

            // Cancel clicked
            if (transactionId === null) {
                return;
            }

            // Empty Transaction ID
            if (!transactionId.trim()) {

                alert("Transaction ID is required.");

                return;
            }

            const confirmPayment = confirm(
                "Have you successfully paid the student?\n\n" +
                "Transaction ID: " + transactionId.trim()
            );

            if (!confirmPayment) {
                return;
            }

            try {

                const res = await fetch(
                    "/api/admin/withdraw/paid/" +
                    userId +
                    "/" +
                    requestId,
                    {
                        method: "PUT",

                        headers: {

                            "Content-Type": "application/json",

                            Authorization: "Bearer " + token

                        },

                        body: JSON.stringify({

                            transactionId: transactionId.trim()

                        })

                    }
                );

                const data = await res.json();

                if (!res.ok || !data.success) {

                    alert(
                        data.message ||
                        "Payment update failed"
                    );

                    return;
                }

                alert(
                    "Payment marked as Paid successfully!\n\n" +
                    "Transaction ID: " +
                    data.transactionId
                );

                await loadWithdraws();

                await loadDashboard();

            } catch (err) {

                console.error(
                    "Mark Paid Error:",
                    err
                );

                alert(
                    "Something went wrong while updating payment."
                );

            }

        }

        async function deleteWithdraw(userId, requestId) {

            if (!confirm("Delete this withdraw request?")) return;

            const res = await fetch(
                "/api/admin/withdraw/delete/" + userId + "/" + requestId,
                {
                    method: "DELETE",
                    headers: {
                        Authorization: "Bearer " + token
                    }
                }
            );

            const data = await res.json();

            if (!res.ok || !data.success) {
                alert(data.message || "Delete failed");
                return;
            }

            await loadWithdraws();
            await loadDashboard();
        }

        async function unblockUser(id) {

            if (!confirm("Unblock this student?")) return;

            const res = await fetch("/api/admin/unblock/" + id, {
                method: "PUT",
                headers: {
                    Authorization: "Bearer " + token
                }
            });

            const data = await res.json();

            alert(data.message);

            loadUsers();

        }
        //==========================
        // Initial Load
        //==========================

        loadDashboard();
        loadUsers();
        loadWithdraws();


        //==========================
        // Auto Refresh Dashboard
        // Every 1 Second
        //==========================

        setInterval(() => {

            loadDashboard();

        }, 1000);


        //==========================
        // Auto Refresh Users
        // Every 1 Second
        //==========================

        setInterval(() => {

            loadUsers();

        }, 1000);
    </script>
