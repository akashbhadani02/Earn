<!DOCTYPE html>
<html>

<head>

    <title>Admin Panel</title>

    <style>
        /* =========================================
   GLOBAL RESET
========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.25), transparent 35%),
                radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.20), transparent 35%),
                linear-gradient(135deg, #020617, #0f172a 45%, #1e293b);
            min-height: 100vh;
            padding: 25px;
            color: #ffffff;
        }


        /* =========================================
   MAIN HEADER
========================================= */

        body>div:first-child {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            padding: 18px 22px;
            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);

            position: relative;
            overflow: hidden;
        }

        body>div:first-child::before {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            background: rgba(59, 130, 246, 0.18);
            border-radius: 50%;
            top: -80px;
            right: -50px;
            filter: blur(10px);
        }

        body>div:first-child h2 {
            margin: 0;
            position: relative;
            z-index: 2;
        }

        body>div:first-child button {
            position: relative;
            z-index: 2;
        }


        /* =========================================
   HEADINGS
========================================= */

        h2 {
            margin: 30px 0 18px;
            font-size: 26px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: 0.3px;
        }

        h2::after {
            content: "";
            display: block;
            width: 55px;
            height: 4px;
            margin-top: 8px;
            border-radius: 10px;
            background: linear-gradient(90deg, #38bdf8, #6366f1);
        }


        /* =========================================
   DASHBOARD CARDS
========================================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 25px 0 35px;
        }

        .card {
            position: relative;
            overflow: hidden;

            min-height: 145px;
            padding: 25px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border-radius: 20px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.25);

            transition: all 0.3s ease;
        }

        .card::before {
            content: "";
            position: absolute;

            width: 130px;
            height: 130px;

            border-radius: 50%;

            top: -60px;
            right: -50px;

            background: rgba(255, 255, 255, 0.08);
        }

        .card:hover {
            transform: translateY(-7px) scale(1.02);

            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.4);
        }

        .card h3 {
            position: relative;
            z-index: 2;

            color: #cbd5e1;
            font-size: 16px;
            font-weight: 600;

            margin-bottom: 10px;
        }

        .card h1 {
            position: relative;
            z-index: 2;

            font-size: 34px;
            font-weight: 800;

            color: #38bdf8;
        }


        /* Individual Card Colors */

        .card:nth-child(1) h1 {
            color: #38bdf8;
        }

        .card:nth-child(2) h1 {
            color: #22c55e;
        }

        .card:nth-child(3) h1 {
            color: #fbbf24;
        }

        .card:nth-child(4) h1 {
            color: #f87171;
        }


        /* =========================================
   SEARCH INPUT
========================================= */

        #search {
            width: 100%;
            max-width: 450px;

            padding: 14px 18px;

            margin: 5px 0 20px;

            border: 2px solid rgba(255, 255, 255, 0.10);

            outline: none;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.95);

            color: #111827;

            font-size: 16px;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.15);

            transition: 0.3s;
        }

        #search:focus {
            border-color: #38bdf8;

            box-shadow:
                0 0 0 4px rgba(56, 189, 248, 0.15);
        }

        #search::placeholder {
            color: #64748b;
        }


        /* =========================================
   TABLE WRAPPER EFFECT
========================================= */

        table {
            width: 100%;

            border-collapse: separate;
            border-spacing: 0;

            margin-bottom: 40px;

            background: #ffffff;

            color: #111827;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.30);
        }


        /* =========================================
   TABLE HEADER
========================================= */

        thead {
            background: linear-gradient(135deg,
                    #2563eb,
                    #4f46e5);

            color: #ffffff;
        }

        th {
            padding: 16px 14px;

            font-size: 14px;

            font-weight: 700;

            text-align: left;

            white-space: nowrap;

            letter-spacing: 0.3px;
        }


        /* =========================================
   TABLE BODY
========================================= */

        td {
            padding: 14px;

            font-size: 14px;

            border-bottom: 1px solid #e5e7eb;

            vertical-align: middle;
        }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:nth-child(even) {
            background: #f8fafc;
        }

        tbody tr:hover {
            background: #eff6ff;

            transform: scale(1.002);
        }


        /* Last Row */

        tbody tr:last-child td {
            border-bottom: none;
        }


        /* =========================================
   BUTTON BASE
========================================= */

        button {
            border: none;

            padding: 9px 14px;

            margin: 3px;

            border-radius: 8px;

            color: #ffffff;

            cursor: pointer;

            font-size: 13px;

            font-weight: 600;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.20);
        }

        button:active {
            transform: scale(0.96);
        }


        /* =========================================
   ACTION BUTTON COLORS
========================================= */

        /* Edit */

        button[onclick^="editWallet"] {
            background: linear-gradient(135deg,
                    #2563eb,
                    #1d4ed8);
        }


        /* Delete User */

        button[onclick^="deleteUser"] {
            background: linear-gradient(135deg,
                    #ef4444,
                    #dc2626);
        }


        /* Unblock */

        button[onclick^="unblockUser"] {
            background: linear-gradient(135deg,
                    #22c55e,
                    #15803d) !important;
        }


        /* Approve */

        button[onclick^="approveWithdraw"] {
            background: linear-gradient(135deg,
                    #2563eb,
                    #1d4ed8) !important;
        }


        /* Reject */

        button[onclick^="rejectWithdraw"] {
            background: linear-gradient(135deg,
                    #ef4444,
                    #b91c1c) !important;
        }


        /* Mark Paid */

        button[onclick^="markWithdrawPaid"] {
            background: linear-gradient(135deg,
                    #16a34a,
                    #15803d) !important;
        }


        /* Delete Withdraw */

        button[onclick^="deleteWithdraw"] {
            background: linear-gradient(135deg,
                    #64748b,
                    #334155) !important;
        }


        /* =========================================
   LOGOUT BUTTON
========================================= */

        body>div:first-child button {
            background: linear-gradient(135deg,
                    #ef4444,
                    #b91c1c) !important;

            padding: 11px 22px !important;

            border-radius: 10px !important;

            font-size: 14px !important;

            font-weight: 700;

            box-shadow:
                0 5px 15px rgba(239, 68, 68, 0.25);
        }

        body>div:first-child button:hover {
            background: linear-gradient(135deg,
                    #dc2626,
                    #991b1b) !important;
        }


        /* =========================================
   STATUS BADGES
========================================= */

        td span {
            white-space: nowrap;
        }


        /* =========================================
   WITHDRAW TABLE
========================================= */

        #withdrawTable td {
            min-width: 100px;
        }

        #withdrawTable td:nth-child(5) {
            line-height: 1.7;
            font-size: 13px;
        }


        /* =========================================
   EMPTY TABLE MESSAGE
========================================= */

        #withdrawTable td[colspan] {
            text-align: center;

            padding: 30px;

            color: #64748b;

            font-weight: 600;

            background: #f8fafc;
        }


        /* =========================================
   RESPONSIVE TABLE CONTAINER
========================================= */

        @media (max-width: 1100px) {

            body {
                padding: 20px;
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            table {
                display: block;

                overflow-x: auto;

                white-space: nowrap;

                -webkit-overflow-scrolling: touch;
            }

            thead,
            tbody,
            tr {
                width: 100%;
            }

        }


        /* =========================================
   TABLET
========================================= */

        @media (max-width: 768px) {

            body {
                padding: 14px;
            }


            /* Header */

            body>div:first-child {
                padding: 16px;

                flex-direction: column !important;

                align-items: stretch !important;

                gap: 12px;
            }

            body>div:first-child h2 {
                font-size: 22px;

                text-align: center;
            }

            body>div:first-child button {
                width: 100%;
            }


            /* Cards */

            .cards {
                grid-template-columns: repeat(2, 1fr);

                gap: 14px;
            }

            .card {
                min-height: 125px;

                padding: 18px;
            }

            .card h3 {
                font-size: 14px;
            }

            .card h1 {
                font-size: 28px;
            }


            /* Headings */

            h2 {
                font-size: 21px;

                margin: 24px 0 15px;
            }


            /* Search */

            #search {
                max-width: 100%;

                margin: 5px 0 15px;
            }


            /* Tables */

            table {
                display: block;

                width: 100%;

                overflow-x: auto;

                white-space: nowrap;

                border-radius: 12px;
            }

            th {
                padding: 12px;

                font-size: 13px;
            }

            td {
                padding: 11px;

                font-size: 13px;
            }

            button {
                padding: 7px 10px;

                font-size: 12px;
            }

        }


        /* =========================================
   MOBILE
========================================= */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }


            /* Dashboard */

            .cards {
                grid-template-columns: 1fr;

                gap: 12px;
            }

            .card {
                min-height: 110px;

                border-radius: 15px;
            }

            .card h1 {
                font-size: 30px;
            }


            /* Heading */

            h2 {
                font-size: 20px;

                margin: 22px 0 13px;
            }


            /* Table */

            table {
                margin-bottom: 28px;

                border-radius: 10px;
            }

            th,
            td {
                padding: 10px;

                font-size: 12px;
            }


            /* Buttons */

            td button {
                display: inline-block;

                width: auto;

                min-width: 80px;

                margin: 3px 2px;
            }

        }


        /* =========================================
   VERY SMALL MOBILE
========================================= */

        @media (max-width: 400px) {

            body {
                padding: 8px;
            }

            body>div:first-child {
                padding: 14px;
            }

            body>div:first-child h2 {
                font-size: 19px;
            }

            .card {
                padding: 15px;
            }

            .card h3 {
                font-size: 13px;
            }

            .card h1 {
                font-size: 26px;
            }

            #search {
                padding: 12px 14px;

                font-size: 14px;
            }

            th,
            td {
                padding: 8px;

                font-size: 11px;
            }

            td button {
                display: block;

                width: 100%;

                margin: 5px 0;
            }

        }


        /* =========================================
   CUSTOM SCROLLBAR
========================================= */

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(#3b82f6,
                    #6366f1);

            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(#2563eb,
                    #4f46e5);
        }


        /* =========================================
   SELECTION
========================================= */

        ::selection {
            background: #3b82f6;
            color: #ffffff;
        }
    </style>

</head>

<body>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2>Admin Dashboard</h2>

        <button onclick="logout()" style="background:red;color:white;border:none;padding:10px 18px;border-radius:6px;">
            Logout
        </button>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Users</h3>
            <h1 id="totalUsers">0</h1>
        </div>

        <div class="card">
            <h3>Total Wallet</h3>
            <h1 id="wallet">0</h1>
        </div>

        <div class="card">
            <h3>Total Earn</h3>
            <h1 id="earn">0</h1>
        </div>

        <div class="card">
            <h3>Pending Withdraw</h3>
            <h1 id="withdraw">0</h1>
        </div>

    </div>
    <h2>Withdraw Requests</h2>

    <table>

        <thead>

            <tr>

                <th>Name</th>
                <th>Mobile</th>
                <th>Amount</th>
                <th>Payment Method</th>
                <th>Payment Details</th>
                <th>Status</th>
                <th>Transaction ID</th>
                <th>Date</th>
                <th>Paid Date</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="withdrawTable">

        </tbody>

    </table>

    <input id="search" placeholder="Search User" onkeyup="searchUser()">

    <h2>All Users</h2>

    <table>

        <thead>

            <tr>

                <th>Name</th>
                <th>Mobile</th>
                <th>Status</th>
                <th>Wallet</th>
                <th>Total Earn</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="userTable">

        </tbody>

    </table>

    <script>

        const token = localStorage.getItem("adminToken");

        if (!token) {

            location.href = "admin-login.html";

        }

        let allUsers = [];

        //==========================
        // Dashboard
        //==========================

        async function loadDashboard() {

            const res = await fetch("/api/admin/dashboard", {

                headers: {

                    Authorization: "Bearer " + token

                }

            });

            const data = await res.json();

            if (!data.success) {

                alert(data.message);

                return;

            }

            document.getElementById("totalUsers").innerHTML = data.totalUsers;
            document.getElementById("wallet").innerHTML =
                Number(data.totalWallet).toFixed(2);

            document.getElementById("earn").innerHTML =
                Number(data.totalEarn).toFixed(2);
            document.getElementById("withdraw").innerHTML =
                Number(data.pendingWithdraw).toFixed(2);

        }

        //==========================
        // Load Users
        //==========================

        async function loadUsers() {

            const res = await fetch("/api/admin/users", {

                headers: {

                    Authorization: "Bearer " + token

                }

            });

            const data = await res.json();

            if (!data.success) {

                alert(data.message);

                return;

            }

            allUsers = data.users || [];

            showUsers(allUsers);

        }

        //==========================
        // Show Users
        //==========================

        //==========================
        // Show Users
        //==========================

        function showUsers(users) {

            let html = "";

            users.forEach(user => {

                // Online / Offline Status
                const statusHTML = user.isOnline
                    ? `<span style="
                color: #16a34a;
                font-weight: bold;
                background: #dcfce7;
                padding: 5px 10px;
                border-radius: 20px;
                display: inline-block;
              ">🟢 Online</span>`
                    : `<span style="
                color: #dc2626;
                font-weight: bold;
                background: #fee2e2;
                padding: 5px 10px;
                border-radius: 20px;
                display: inline-block;
              ">🔴 Offline</span>`;

                html += `

<tr>

<td>${user.name}</td>

<td>${user.mobile}</td>

<td>
${user.isBlocked
                        ? '<span style="color:red;font-weight:bold;">🚫 Blocked</span>'
                        : statusHTML}
</td>

<td>${Number(user.wallet || 0).toFixed(2)}</td>

<td>${Number(user.totalEarn || 0).toFixed(2)}</td>

<td>

<button onclick="editWallet('${user._id}',${user.wallet || 0})">
Edit
</button>

<button onclick="deleteUser('${user._id}')">
Delete
</button>

${user.isBlocked ? `
<button onclick="unblockUser('${user._id}')"
style="background:#16a34a;">
Unblock
</button>
` : ""}

</td>

</tr>

`;

            });

            document.getElementById("userTable").innerHTML = html;

        }

        //==========================
        // Search
        //==========================

        function searchUser() {

            const value = document
                .getElementById("search")
                .value
                .toLowerCase();

            const filtered = allUsers.filter(user => {

                return user.name.toLowerCase().includes(value)
                    ||
                    user.mobile.includes(value);

            });

            showUsers(filtered);

        }

        //==========================
        // Edit Wallet
        //==========================

        async function editWallet(id, currentWallet) {

            const amount = prompt("Enter New Wallet", currentWallet);

            if (amount == null) return;
            if (isNaN(amount)) {

                alert("Enter Valid Number");

                return;

            }

            await fetch("/api/admin/wallet/" + id, {

                method: "PUT",

                headers: {

                    "Content-Type": "application/json",

                    Authorization: "Bearer " + token

                },

                body: JSON.stringify({

                    wallet: Number(amount)

                })

            });

            loadUsers();

            loadDashboard();

        }

        //==========================
        // Delete User
        //==========================

        async function deleteUser(id) {

            if (!confirm("Delete User?")) return;

            await fetch("/api/admin/user/" + id, {

                method: "DELETE",

                headers: {

                    Authorization: "Bearer " + token

                }

            });

            loadUsers();

            loadDashboard();

        }

        async function loadWithdraws() {

            const res = await fetch(

                "/api/admin/withdraws",

                {

                    headers: {

                        Authorization: "Bearer " + token

                    }

                }

            );

            const data = await res.json();

            if (!res.ok || !data.success) {
                console.error("Withdraw Load Error:", data.message);
                document.getElementById("withdrawTable").innerHTML = `
                    <tr><td colspan="10">${data.message || "Failed to load withdraw requests"}</td></tr>
                `;
                return;
            }

            let html = "";

            const list = data.withdraws || [];

            if (list.length === 0) {
                document.getElementById("withdrawTable").innerHTML = `
                    <tr><td colspan="10">No Withdraw Requests Found</td></tr>
                `;
                return;
            }

            list.forEach(w => {

                html += `

<tr>

<td>${w.name}</td>

<td>${w.mobile}</td>

<td>₹${Number(w.amount || 0).toFixed(2)}</td>

<td>
    ${w.paymentMethod || "-"}
</td>

<td>

${w.paymentMethod === "UPI"
                        ? `
<b>UPI:</b><br>
${w.upiId || "-"}
`
                        : `
<b>Bank:</b> ${w.bankName || "-"}<br>

<b>Holder:</b> ${w.accountHolderName || "-"}<br>

<b>Account:</b> ${w.accountNumber || "-"}<br>

<b>IFSC:</b> ${w.ifscCode || "-"}
`
                    }

</td>

<td>
<strong>${w.status}</strong>
</td>   

<td>
    ${w.transactionId || "-"}
</td>

<td>
    ${w.date
                        ? new Date(w.date).toLocaleString()
                        : "-"
                    }
</td>

<td>
    ${w.paidAt
                        ? new Date(w.paidAt).toLocaleString()
                        : "-"
                    }
</td>

<td>

${w.status === "Pending" ? `
<button
    onclick="approveWithdraw('${w.userId}','${w.requestId}')"
    style="background:#2563eb;">
    Approve
</button>

<button
    onclick="rejectWithdraw('${w.userId}','${w.requestId}')"
    style="background:#ef4444;">
    Reject
</button>
` : ""}

${w.status === "Approved" ? `
<button
    onclick="markWithdrawPaid('${w.userId}','${w.requestId}')"
    style="background:#16a34a;">
    Mark Paid
</button>
` : ""}

<button
    onclick="deleteWithdraw('${w.userId}','${w.requestId}')"
    style="background:#6b7280;">
    Delete
</button>

</td>

</tr>

`;

            });

            document.getElementById("withdrawTable").innerHTML = html;

        }

        async function approveWithdraw(userId, requestId) {

            if (!confirm("Approve this withdraw request?")) return;

            const res = await fetch(
                "/api/admin/withdraw/approve/" + userId + "/" + requestId,
                {
                    method: "PUT",
                    headers: {
                        Authorization: "Bearer " + token
                    }
                }
            );

            const data = await res.json();

            if (!res.ok || !data.success) {
                alert(data.message || "Approve failed");
                return;
            }

            await loadWithdraws();
            await loadDashboard();
        }

        async function rejectWithdraw(userId, requestId) {

            if (!confirm("Reject this withdraw request? Amount will be refunded to student wallet.")) return;

            const res = await fetch(
                "/api/admin/withdraw/reject/" + userId + "/" + requestId,
                {
                    method: "PUT",
                    headers: {
                        Authorization: "Bearer " + token
                    }
                }
            );

            const data = await res.json();

            if (!res.ok || !data.success) {
                alert(data.message || "Reject failed");
                return;
            }

            await loadWithdraws();
            await loadDashboard();
        }

        //==========================
        // Logout
        //==========================

        function logout() {

            if (!confirm("Are you sure you want to logout?")) return;

            localStorage.removeItem("adminToken");

            location.href = "admin-login.html";

        }

        //==========================
        // Mark Withdraw as Paid
        //==========================

        async function markWithdrawPaid(userId, requestId) {

            const transactionId = prompt(
                "Enter Payment Transaction ID:"
            );

            // Cancel clicked
            if (transactionId === null) {
                return;
            }

            // Empty Transaction ID
            if (!transactionId.trim()) {

                alert("Transaction ID is required.");

                return;
            }

            const confirmPayment = confirm(
                "Have you successfully paid the student?\n\n" +
                "Transaction ID: " + transactionId.trim()
            );

            if (!confirmPayment) {
                return;
            }

            try {

                const res = await fetch(
                    "/api/admin/withdraw/paid/" +
                    userId +
                    "/" +
                    requestId,
                    {
                        method: "PUT",

                        headers: {

                            "Content-Type": "application/json",

                            Authorization: "Bearer " + token

                        },

                        body: JSON.stringify({

                            transactionId: transactionId.trim()

                        })

                    }
                );

                const data = await res.json();

                if (!res.ok || !data.success) {

                    alert(
                        data.message ||
                        "Payment update failed"
                    );

                    return;
                }

                alert(
                    "Payment marked as Paid successfully!\n\n" +
                    "Transaction ID: " +
                    data.transactionId
                );

                await loadWithdraws();

                await loadDashboard();

            } catch (err) {

                console.error(
                    "Mark Paid Error:",
                    err
                );

                alert(
                    "Something went wrong while updating payment."
                );

            }

        }

        async function deleteWithdraw(userId, requestId) {

            if (!confirm("Delete this withdraw request?")) return;

            const res = await fetch(
                "/api/admin/withdraw/delete/" + userId + "/" + requestId,
                {
                    method: "DELETE",
                    headers: {
                        Authorization: "Bearer " + token
                    }
                }
            );

            const data = await res.json();

            if (!res.ok || !data.success) {
                alert(data.message || "Delete failed");
                return;
            }

            await loadWithdraws();
            await loadDashboard();
        }

        async function unblockUser(id) {

            if (!confirm("Unblock this student?")) return;

            const res = await fetch("/api/admin/unblock/" + id, {
                method: "PUT",
                headers: {
                    Authorization: "Bearer " + token
                }
            });

            const data = await res.json();

            alert(data.message);

            loadUsers();

        }
        //==========================
        // Initial Load
        //==========================

        loadDashboard();
        loadUsers();
        loadWithdraws();


        //==========================
        // Auto Refresh Dashboard
        // Every 1 Second
        //==========================

        setInterval(() => {

            loadDashboard();

        }, 1000);


        //==========================
        // Auto Refresh Users
        // Every 1 Second
        //==========================

        setInterval(() => {

            loadUsers();

        }, 1000);
    </script>
