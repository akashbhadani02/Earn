<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aducate Admin App</title>
<link rel="icon" href="/api/branding/icon?v=admin&size=32">
<link rel="apple-touch-icon" href="/api/branding/icon?v=admin&size=180">
<link rel="manifest" href="/admin-manifest.webmanifest?v=1">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
html,body{margin:0;min-height:100%;background:linear-gradient(135deg,#020617,#0f172a,#2563eb);color:#fff}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:min(430px,100%);padding:30px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:rgba(255,255,255,.10);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(0,0,0,.35)}
.logo{width:82px;height:82px;margin:0 auto 14px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);font-size:42px}
h1{text-align:center;font-size:28px;margin:0 0 6px}
.sub{text-align:center;color:#cbd5e1;font-size:14px;margin-bottom:26px}
label{display:block;font-size:13px;font-weight:700;color:#e2e8f0;margin:0 0 7px}
input{width:100%;padding:14px 15px;margin-bottom:15px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(255,255,255,.10);color:#fff;outline:none;font-size:16px}
input::placeholder{color:#94a3b8}
input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.15)}
button{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer}
.login{color:#fff;background:linear-gradient(90deg,#2563eb,#3b82f6);box-shadow:0 10px 25px rgba(37,99,235,.28)}
.install{margin-top:10px;color:#0f172a;background:#fff;display:none}
.back{margin-top:10px;background:transparent;color:#cbd5e1;border:1px solid rgba(255,255,255,.18)}
#msg{text-align:center;min-height:20px;margin-top:14px;font-size:13px;color:#fecaca}
.secure{text-align:center;margin-top:20px;color:#94a3b8;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🛡️</div>
  <h1>Aducate Admin App</h1>
  <div class="sub">Secure Admin Command Center</div>

  <label for="username">Username</label>
  <input id="username" autocomplete="username" placeholder="Admin username">

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Admin password">

  <button class="login" id="loginBtn" onclick="login()">Login to Admin</button>
  <button class="install" id="installBtn" onclick="installApp()">📲 Install Admin App</button>
  <button class="back" onclick="location.href='/login.html'">← Back to Student Login</button>

  <div id="msg"></div>
  <div class="secure">🔒 Admin access only</div>
</div>

<script>
let deferredPrompt=null;

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  document.getElementById('installBtn').style.display='block';
});

async function installApp(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('installBtn').style.display='none';
}

async function login(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const msg=document.getElementById('msg');
  const btn=document.getElementById('loginBtn');
  if(!username||!password){msg.textContent='Username અને Password નાખો.';return;}
  btn.disabled=true; btn.textContent='Please wait...'; msg.textContent='';
  try{
    const res=await fetch('/api/admin/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,password})
    });
    const data=await res.json();
    if(data.success){
      localStorage.setItem('adminToken',data.token);
      location.href='/admin.html';
    }else{
      msg.textContent=data.message||'Admin login failed.';
    }
  }catch(e){
    msg.textContent='Server connection error. Please try again.';
  }finally{
    btn.disabled=false; btn.textContent='Login to Admin';
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter') login();});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
</script>
</body>
</html>
