<!DOCTYPE html>
<html lang="gu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Mastery Pro - Compact Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #2d3436;
            user-select: none;
            -webkit-user-select: none;
            background: linear-gradient(-45deg, #ff007f, #7928ca, #00d2ff, #38ef7d, #ffb300);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            background-attachment: fixed;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body.dark {
            background: #0f0c20 !important;
        }

        body.dark .card {
            background: rgba(25, 20, 45, 0.95);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.1);
        }

        body.dark #question {
            color: #ffffff !important;
        }

        body.dark .option-btn {
            background: #231b38;
            color: #ffffff;
            border: 2px solid #5b3e8e;
        }

        .hidden {
            display: none !important;
        }

        .card {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            animation: cardShow 0.5s ease;
            position: relative;
            backdrop-filter: blur(10px);
        }

        @keyframes cardShow {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        /* નાની સાઈઝના Top Action Icons */
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            color: #2d3436;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        body.dark .icon-btn {
            background: linear-gradient(135deg, #2d2448, #1a132e);
            color: #fff;
        }

        .icon-btn:hover {
            transform: translateY(-2px);
        }

        #dashboard h2 {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #ff0080, #7928ca, #00c6ff, #00b894);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 3s linear infinite;
        }

        @keyframes gradientText {
            0% { background-position: 0%; }
            100% { background-position: 200%; }
        }

        .wallet-box {
            padding: 16px;
            border-radius: 18px;
            color: white;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            box-shadow: 0 8px 20px rgba(255, 8, 68, 0.3);
            text-align: center;
        }

        .wallet-box small {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .wallet-val {
            display: block;
            margin-top: 2px;
            font-size: 30px;
            font-weight: 800;
        }

        /* ==========================================================================
           COMPACT & SMALLER BUTTONS
           ========================================================================== */
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn {
            border: none;
            width: 100%;
            min-height: 44px; /* નાના બટન માટે હાઈટ ઓછી કરી */
            padding: 8px 12px; /* Padding ઘટાડ્યું */
            border-radius: 12px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 13px; /* નાની ફોન્ટ સાઈઝ */
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-full {
            grid-column: 1 / -1;
        }

        .btn-quiz { background: linear-gradient(135deg, #ff0844, #ff4e50); box-shadow: 0 4px 12px rgba(255, 8, 68, 0.25); }
        .btn-learn { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 4px 12px rgba(56, 239, 125, 0.25); }
        .btn-spin { background: linear-gradient(135deg, #ffe000, #799f0c); color: #1a2a00; text-shadow: none; }
        .btn-reward { background: linear-gradient(135deg, #ff007f, #7928ca); box-shadow: 0 4px 12px rgba(255, 0, 127, 0.25); }
        .btn-bonus { background: linear-gradient(135deg, #f857a6, #ff5858); box-shadow: 0 4px 12px rgba(248, 87, 166, 0.25); }
        .btn-withdraw { background: linear-gradient(135deg, #8A2387, #E94057, #F27121); box-shadow: 0 4px 12px rgba(233, 64, 87, 0.3); }

        .btn-withdraw:disabled, .btn-spin:disabled {
            background: linear-gradient(135deg, #bdc3c7, #7f8c8d);
            opacity: 0.65;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            color: #fff;
        }

        .telegram-btn {
            background: linear-gradient(135deg, #0088cc, #00b4d8);
            color: white;
            text-decoration: none;
            gap: 6px;
        }

        .telegram-icon {
            width: 16px;
            height: 16px;
            fill: white;
        }

        /* Quiet Activities */
        .activity-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .activity-btn {
            border: 0;
            border-radius: 12px;
            padding: 10px 8px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .activity-btn small { display: block; font-size: 10px; opacity: 0.9; margin-top: 2px; }

        .a1 { background: linear-gradient(135deg, #bf55ec, #7d2ae8); }
        .a2 { background: linear-gradient(135deg, #00c6ff, #0072ff); }
        .a3 { background: linear-gradient(135deg, #f857a6, #ff5858); }
        .a4 { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .a5 { background: linear-gradient(135deg, #fc4a1a, #f7b733); }
        .a6 { background: linear-gradient(135deg, #ff007f, #7928ca); }
        .a7 { background: linear-gradient(135deg, #00b894, #00cec9); }
        .a8 { background: linear-gradient(135deg, #4776E6, #8E54E9); }

        .option-btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
            border: 2px solid #f0e6ff;
            background: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .withdraw-popup {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .withdraw-box {
            width: 360px;
            max-width: 90%;
            background: #fff;
            border-radius: 20px;
            padding: 20px;
        }

        .withdraw-box select, .withdraw-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 2px solid #eee;
            border-radius: 10px;
            outline: none;
        }

        .withdraw-buttons { display: flex; gap: 10px; }
        .withdraw-buttons button {
            flex: 1; padding: 10px; border: none; border-radius: 10px; color: #fff; cursor: pointer; font-weight: 700;
        }
    </style>
</head>

<body>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard" class="card">
        <!-- Top Icon Bar -->
        <div class="top-action-bar">
            <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
            <div style="display:flex; gap:8px;">
                <button class="icon-btn" onclick="location.href='profile.html'" title="Profile">👤</button>
                <!-- બદલેલો નવો Admin Icon (⚙️ Gear icon) -->
                <button class="icon-btn" onclick="location.href='admin.html'" title="Admin Dashboard">⚙️</button>
            </div>
        </div>

        <h2>Student Dashboard</h2>

        <div class="wallet-box">
            <small>Total Balance</small>
            <span class="wallet-val">©<span id="wallet">0.00</span></span>
        </div>

        <!-- Small & Compact Grid Buttons -->
        <div class="btn-grid">
            <button class="btn btn-quiz" onclick="showScreen('quiz')">📚 Quiz</button>
            <button class="btn btn-learn" onclick="showScreen('activities')">🎮 Learning</button>

            <button id="spinBtn" class="btn btn-spin btn-full" onclick="spinWheel()" disabled>🔒 Spin Wheel (0/100)</button>

            <button class="btn btn-reward" onclick="claimDailyReward()">🎁 Reward</button>
            <button class="btn btn-bonus" onclick="claimBonus()">⚡ ©500 Bonus</button>

            <button id="withdrawBtn" class="btn btn-withdraw btn-full" onclick="openWithdrawPopup()" disabled>💰 Withdraw (Min ©500)</button>

            <a href="https://t.me/+blPfoyArs0U1NmI1" target="_blank" rel="noopener noreferrer" class="btn telegram-btn btn-full">
                <svg class="telegram-icon" viewBox="0 0 24 24">
                    <path d="M21.5 3.5L18.3 20c-.24 1.17-.88 1.46-1.79.91l-4.91-3.62-2.37 2.28c-.26.26-.48.48-.99.48l.35-5.01 9.12-8.24c.4-.35-.09-.55-.62-.2L6.04 13.72l-4.82-1.51c-1.05-.33-1.07-1.05.22-1.55L20.27 3.02c.89-.33 1.67.21 1.23.48z"/>
                </svg>
                Join Telegram
            </a>
        </div>
    </div>

    <!-- ACTIVITIES DASHBOARD -->
    <div id="activities" class="card hidden">
        <h2 style="text-align:center;margin-bottom:12px;color:#ff007f;font-size:20px;">🎮 Learning Zone</h2>
        
        <div class="activity-grid">
            <button type="button" class="activity-btn a1">🔀 Arrange<small>+10 pts</small></button>
            <button type="button" class="activity-btn a2">🧩 Fill Blank<small>+10 pts</small></button>
            <button type="button" class="activity-btn a3">🛠️ Fix Sentence<small>+15 pts</small></button>
            <button type="button" class="activity-btn a4">🔄 Translate<small>+15 pts</small></button>
            <button type="button" class="activity-btn a5">🔤 Word Builder<small>+5 pts</small></button>
            <button type="button" class="activity-btn a6">🎧 Listen<small>+15 pts</small></button>
            <button type="button" class="activity-btn a7">🎤 Speak<small>+20 pts</small></button>
            <button type="button" class="activity-btn a8">📖 Reading<small>+15 pts</small></button>
        </div>
        <button class="btn" style="background:#374151;margin-top:15px;" onclick="showScreen('dashboard')">Back</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz" class="card hidden">
        <h3 id="question" style="text-align:center;margin-bottom:15px;color:#7928ca;">Loading...</h3>
        <div id="options"></div>
        <button class="btn" style="background:#374151;margin-top:15px;" onclick="showScreen('dashboard')">Back</button>
    </div>

    <!-- WITHDRAW POPUP -->
    <div id="withdrawPopup" class="withdraw-popup">
        <div class="withdraw-box">
            <h3 style="text-align:center;margin-bottom:10px;color:#7928ca;">Withdraw Request</h3>
            <p id="withdrawAmountText" style="text-align:center;color:#00b894;font-weight:bold;margin-bottom:12px;"></p>

            <select id="paymentMethod" onchange="changePaymentMethod()">
                <option value="UPI">UPI</option>
                <option value="Bank">Bank</option>
            </select>

            <div id="upiSection">
                <input type="text" id="upiId" placeholder="Enter UPI ID">
            </div>

            <div id="bankSection" style="display:none;">
                <input type="text" id="bankName" placeholder="Bank Name">
                <input type="text" id="accountHolderName" placeholder="Account Holder">
                <input type="text" id="accountNumber" placeholder="Account Number">
                <input type="text" id="ifscCode" placeholder="IFSC Code">
            </div>

            <div class="withdraw-buttons">
                <button style="background:#00b894;" onclick="submitWithdraw()">Submit</button>
                <button style="background:#d63031;" onclick="closeWithdrawPopup()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("token");

        let wallet = 0, spinCycleQuestionsAnswered = 0;

        async function loadWallet() {
            if (!token) return;
            try {
                const res = await fetch("/api/wallet", {
                    headers: { "Authorization": "Bearer " + token }
                });
                const data = await res.json();
                if (data.success) applyWalletData(data);
            } catch (err) {
                console.error(err);
            }
        }

        function applyWalletData(data) {
            wallet = Number(data.wallet || 0);
            spinCycleQuestionsAnswered = Number(data.spinCycleQuestionsAnswered || 0);

            document.getElementById("wallet").innerText = wallet.toFixed(2);
            document.getElementById("withdrawBtn").disabled = (wallet < 500);

            const count = Math.min(100, spinCycleQuestionsAnswered);
            const spinBtn = document.getElementById("spinBtn");

            if (spinBtn) {
                if (count >= 100) {
                    spinBtn.disabled = false;
                    spinBtn.innerText = "🎡 Spin Wheel — UNLOCKED";
                } else {
                    spinBtn.disabled = true;
                    spinBtn.innerText = `🔒 Spin Wheel (${count}/100)`;
                }
            }
        }

        function showScreen(id) {
            ['dashboard', 'quiz', 'activities'].forEach(screenId => {
                const el = document.getElementById(screenId);
                if (el) el.classList.toggle('hidden', screenId !== id);
            });
        }

        function toggleTheme() {
            document.body.classList.toggle("dark");
            const btn = document.getElementById("themeBtn");
            btn.innerText = document.body.classList.contains("dark") ? "☀️" : "🌙";
        }

        function openWithdrawPopup() {
            document.getElementById("withdrawPopup").style.display = "flex";
            document.getElementById("withdrawAmountText").innerText = "Amount : ©" + wallet;
        }

        function closeWithdrawPopup() {
            document.getElementById("withdrawPopup").style.display = "none";
        }

        function changePaymentMethod() {
            const method = document.getElementById("paymentMethod").value;
            document.getElementById("upiSection").style.display = method === "UPI" ? "block" : "none";
            document.getElementById("bankSection").style.display = method === "Bank" ? "block" : "none";
        }

        function submitWithdraw() {
            alert("Withdraw Request Submitted!");
            closeWithdrawPopup();
        }

        function claimDailyReward() { alert("Reward claimed!"); }
        function claimBonus() { alert("Bonus clicked!"); }
        function spinWheel() { alert("Spin complete!"); }

        loadWallet();
    </script>
</body>

</html>
