<script>
(function () {
  let unlocked = false;

  function unlockDevTools() {
    unlocked = true;
    window.__DEVTOOLS_UNLOCKED__ = true;
    document.documentElement.setAttribute('data-devtools-unlocked', 'true');
  }

  document.addEventListener('keydown', function (e) {
    // Unlock ONLY with Ctrl+Shift+Alt+Z.
    if (e.ctrlKey && e.shiftKey && e.altKey && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      e.stopPropagation();
      unlockDevTools();
      return;
    }

    if (unlocked) return;

    const key = (e.key || '').toLowerCase();

    // Block common DevTools / source shortcuts.
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(key)) ||
      (e.ctrlKey && key === 'u') ||
      (e.metaKey && e.altKey && ['i','j','c'].includes(key))
    ) {
      e.preventDefault();
      e.stopImmediatePropagation();
      return false;
    }
  }, true);

  // Disable browser context menu until the unlock combination is used.
  document.addEventListener('contextmenu', function (e) {
    if (!unlocked) {
      e.preventDefault();
      e.stopImmediatePropagation();
      return false;
    }
  }, true);

  // Also block mouse right-button events before they reach page handlers.
  document.addEventListener('mousedown', function (e) {
    if (!unlocked && e.button === 2) {
      e.preventDefault();
      e.stopImmediatePropagation();
      return false;
    }
  }, true);

  // Block select/copy source-style inspection helpers before unlock.
  document.addEventListener('selectstart', function (e) {
    if (!unlocked && e.target && e.target.closest &&
        e.target.closest('[data-allow-select="true"]')) return;
  }, true);
})();
</script>

<script>

const API = "/api/auth";
let pendingLogin = null;

// One persistent ID per browser/device. The server still enforces the actual
// single active session using activeSessionId, while this ID identifies the device.
function getDeviceId(){
    let id = localStorage.getItem("studentDeviceId");
    if(!id){
        id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(36).slice(2)));
        localStorage.setItem("studentDeviceId", id);
    }
    return id;
}


function showSignup(){

document.getElementById("loginForm").style.display="none";

document.getElementById("signupForm").style.display="block";

document.getElementById("message").innerHTML="";

}

function showLogin(){

document.getElementById("signupForm").style.display="none";

document.getElementById("loginForm").style.display="block";

document.getElementById("message").innerHTML="";

}

async function signup(){

const name=document.getElementById("signupName").value;

const mobile=document.getElementById("signupMobile").value;

const password=document.getElementById("signupPassword").value;

const res=await fetch(API+"/signup",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

name,

mobile,

password

})

});

const data=await res.json();

document.getElementById("message").innerHTML=data.message;

if(data.success){

showLogin();

}

}

async function requestNotificationPermissionBeforeLogin(){

    if ("Notification" in window && Notification.permission === "granted") {
        return true;
    }

    if (!("Notification" in window)) {
        document.getElementById("message").innerHTML =
            "❌ આ browser notifications support કરતું નથી.";
        return false;
    }

    if (!window.isSecureContext) {
        document.getElementById("message").innerHTML =
            "❌ Notifications માટે HTTPS જરૂરી છે.";
        return false;
    }

    if (Notification.permission === "denied") {
        document.getElementById("message").innerHTML =
            "❌ Notifications Block છે. Browser site settings માં Notifications → Allow કરો અને ફરી Login કરો.";
        return false;
    }

    document.getElementById("notificationModal").style.display = "flex";
    document.getElementById("notificationModalMsg").innerHTML = "";
    return false;
}

async function allowNotificationsAndContinue(){

    const btn = document.getElementById("notificationAllowBtn");
    const msg = document.getElementById("notificationModalMsg");

    btn.disabled = true;
    btn.innerText = "Please wait...";
    msg.innerHTML = "";

    try {
        const permission = await Notification.requestPermission();

        if (permission === "granted") {
            document.getElementById("notificationModal").style.display = "none";

            // Continue the exact login that was waiting for permission.
            if (pendingLogin) {
                const credentials = pendingLogin;
                pendingLogin = null;
                await performLogin(credentials.mobile, credentials.password);
            }
        } else {
            // Deny = do not login. User must press Login again.
            pendingLogin = null;
            document.getElementById("notificationModal").style.display = "none";
            document.getElementById("loginMobile").value = "";
            document.getElementById("loginPassword").value = "";
            document.getElementById("message").innerHTML =
                "⚠️ Notifications Allow કર્યા વગર Login થઈ શકશે નહીં. ફરી Login કરો.";
        }
    } catch (error) {
        console.error("Notification permission error:", error);
        pendingLogin = null;
        document.getElementById("notificationModal").style.display = "none";
        document.getElementById("message").innerHTML =
            "❌ Notification permission મળી નથી. ફરી Login કરો.";
    } finally {
        btn.disabled = false;
        btn.innerText = "🔔 Allow Notifications";
    }
}

function denyNotificationsAndReturn(){
    pendingLogin = null;
    document.getElementById("notificationModal").style.display = "none";
    document.getElementById("loginMobile").value = "";
    document.getElementById("loginPassword").value = "";
    document.getElementById("message").innerHTML =
        "⚠️ Notifications Allow કર્યા વગર Login થઈ શકશે નહીં. ફરી Login કરો.";
}


async function login(){

    const mobile = document.getElementById("loginMobile").value.trim();
    const password = document.getElementById("loginPassword").value;

    if(!mobile || !password){
        document.getElementById("message").innerHTML =
            "Mobile Number અને Password નાખો.";
        return;
    }

    // If already granted, login directly. Otherwise show the permission popup.
    if ("Notification" in window && Notification.permission === "granted") {
        await performLogin(mobile, password);
        return;
    }

    if ("Notification" in window && Notification.permission === "denied") {
        document.getElementById("message").innerHTML =
            "❌ Notifications Block છે. Browser site settings માં Notifications → Allow કરો અને ફરી Login કરો.";
        return;
    }

    pendingLogin = { mobile, password };
    await requestNotificationPermissionBeforeLogin();
}


function loginBase64ToUint8Array(base64String){
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = window.atob(base64);
    return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
}

async function registerAdminPushSubscription(token){
    if (!window.isSecureContext || !("Notification" in window) ||
        !("serviceWorker" in navigator) || !("PushManager" in window)) {
        throw new Error("Admin notifications માટે આ browser/HTTPS જરૂરી છે.");
    }

    if (Notification.permission !== "granted") {
        throw new Error("Admin notifications permission Allow નથી.");
    }

    const registration = await navigator.serviceWorker.register("/sw.js", { scope: "/" });
    await navigator.serviceWorker.ready;

    const keyResponse = await fetch("/api/notifications/vapid-public-key", {
        headers: { Authorization: "Bearer " + token }
    });
    const keyData = await keyResponse.json();

    if (!keyResponse.ok || !keyData.success || !keyData.publicKey) {
        throw new Error(keyData.message || "Push notification server configuration missing.");
    }

    let subscription = await registration.pushManager.getSubscription();

    if (!subscription) {
        subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: loginBase64ToUint8Array(keyData.publicKey)
        });
    }

    const saveResponse = await fetch("/api/notifications/subscribe", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
        },
        body: JSON.stringify(subscription.toJSON())
    });
    const saveData = await saveResponse.json();

    if (!saveResponse.ok || !saveData.success) {
        throw new Error(saveData.message || "Push subscription save failed.");
    }

    return true;
}

let blockedTimerInterval = null;

function startBlockedCountdown(remainingMs){
    const box = document.getElementById("blockedTimerBox");
    const timer = document.getElementById("blockedTimerText");
    if(!box || !timer) return;

    clearInterval(blockedTimerInterval);
    box.style.display = "block";

    // Server-provided remaining time is authoritative. This is the same
    // remainingMs derived from the user's canonical blockUntil used by Admin.
    let endTime = Date.now() + Math.max(0, Number(remainingMs || 0));

    function render(){
        const left = Math.max(0, endTime - Date.now());
        const totalSeconds = Math.floor(left / 1000);
        const h = String(Math.floor(totalSeconds / 3600)).padStart(2,"0");
        const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2,"0");
        const sec = String(totalSeconds % 60).padStart(2,"0");
        timer.textContent = h + ":" + m + ":" + sec;

        if(left <= 0){
            clearInterval(blockedTimerInterval);
            box.innerHTML = "✅ Block time completed. Please login again.";
        }
    }
    render();
    blockedTimerInterval = setInterval(render, 1000);
}

async function performLogin(mobile, password){

    const loginButton = document.querySelector('#loginForm button');
    if(loginButton){
        loginButton.disabled = true;
        loginButton.innerText = "Logging in...";
    }

    try{
        const res = await fetch(API+"/login",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "X-Device-ID": getDeviceId()
            },
            body:JSON.stringify({ mobile, password })
        });

        const data = await res.json();

        if(data.blocked){
            document.getElementById("message").innerHTML =
                "🚫 Account blocked.<br>" +
                "Block is active. નીચે actual remaining time દેખાશે.";
            startBlockedCountdown(data.remainingMs);
            if(loginButton){
                loginButton.disabled = false;
                loginButton.innerText = "Login";
            }
            return;
        }

        const timerBox = document.getElementById("blockedTimerBox");
        if(timerBox) timerBox.style.display = "none";

        if(data.success && data.token){
            // Save the real Web Push subscription BEFORE opening the dashboard.
            // Browser permission alone is not enough for Admin -> Student notifications.
            await registerAdminPushSubscription(data.token);

            localStorage.setItem("token", data.token);
            if(data.user) localStorage.setItem("user", JSON.stringify(data.user));

            window.location.replace("earn.html");
        }else{
            document.getElementById("message").innerHTML =
                data.message || "Invalid login details.";
            if(loginButton){
                loginButton.disabled = false;
                loginButton.innerText = "Login";
            }
        }
    }catch(error){
        console.error(error);
        document.getElementById("message").innerHTML =
            "❌ " + (error.message || "Login/notification setup failed.");
        if(loginButton){
            loginButton.disabled = false;
            loginButton.innerText = "Login";
        }
    }
}


let studentDeferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  studentDeferredPrompt=e;
  window.__studentInstallReady=true;
});
window.addEventListener('appinstalled',()=>{
  studentDeferredPrompt=null;
  window.__studentInstallReady=false;
});
async function installStudentApp(){
  if(studentDeferredPrompt){
    studentDeferredPrompt.prompt();
    try{ await studentDeferredPrompt.userChoice; }catch(e){}
    studentDeferredPrompt=null;
    return;
  }
  const standalone=window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  if(standalone){ alert('Aducate Student App is already installed/open as an app.'); return; }
  return;
}
document.addEventListener('DOMContentLoaded',()=>{
  const b=document.getElementById('studentInstallBtn');
  if(b)b.addEventListener('click',installStudentApp);
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{}); }
});
</script>

<script id="globalBrandingClient">
(function(){
  const FALLBACK='/aducate.png';
  let currentVersion=null;
  function setLink(rel, href, sizes){
    let el=document.querySelector(`link[rel="${rel}"]${sizes?`[sizes="${sizes}"]`:''}`);
    if(!el){ el=document.createElement('link'); el.rel=rel; if(sizes) el.sizes=sizes; document.head.appendChild(el); }
    el.href=href;
  }
  function applyBranding(data){
    const version=Number(data?.version||0);
    if(currentVersion===version && document.documentElement.dataset.brandingReady==='1') return;
    currentVersion=version;
    document.documentElement.dataset.brandingReady='1';
    const src=`/api/branding/icon?v=${version}&size=512&t=${Date.now()}`;
    document.querySelectorAll('[data-brand-logo]').forEach(img=>{ img.src=src; img.alt='Aducate Logo'; });
    setLink('icon', src, '192x192');
    setLink('apple-touch-icon', src, '180x180');
    const manifest=document.querySelector('link[rel="manifest"]'); if(manifest) manifest.href=`/student-manifest.webmanifest?v=student-v2&brand=${version}&t=${Date.now()}`;
    // Broadcast the new branding to every open tab/window immediately.
    try { localStorage.setItem('aducate-branding-version', String(version)); } catch(e) {}
    try { if ('BroadcastChannel' in window) { window.__aducateBrandChannel = window.__aducateBrandChannel || new BroadcastChannel('aducate-branding'); window.__aducateBrandChannel.postMessage({type:'BRANDING_UPDATED',version}); } } catch(e) {}
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistration('/').then(reg=>reg?.active?.postMessage({type:'BRANDING_UPDATED',version})).catch(()=>{});
  }
  async function refresh(){
    try{ const r=await fetch('/api/branding?_='+Date.now(),{cache:'no-store'}); const d=await r.json(); if(d.success) applyBranding(d); }catch(e){}
  }
  window.refreshGlobalBranding=refresh;

  // Also force the installed PWA service worker/manifest to revalidate after a branding change.
  if(navigator.serviceWorker){ navigator.serviceWorker.getRegistration('/').then(reg=>{ reg?.update(); reg?.active?.postMessage({type:'CHECK_BRANDING'}); }).catch(()=>{}); }
  try { window.addEventListener('storage', e=>{ if(e.key==='aducate-branding-version') refresh(); }); } catch(e) {}
  try { if ('BroadcastChannel' in window) { window.__aducateBrandChannel = new BroadcastChannel('aducate-branding'); window.__aducateBrandChannel.onmessage=e=>{ if(e.data?.type==='BRANDING_UPDATED') refresh(); }; } } catch(e) {}
  refresh();
  setInterval(refresh,3000);
})();
</script>
