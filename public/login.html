<!DOCTYPE html>
<html lang="en">

<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#506ef0">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English App Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4facfe,#00f2fe);
}

.container{

width:360px;

background:white;

padding:30px;

border-radius:15px;

box-shadow:0 10px 25px rgba(0,0,0,.2);

}

h2{

text-align:center;

margin-bottom:20px;

}

input{

width:100%;

padding:12px;

margin:8px 0;

border:1px solid #ccc;

border-radius:8px;

font-size:16px;

}

width:100%;

padding:12px;

margin-top:10px;

border-radius:8px;

background:#2196f3;

color:white;

font-size:16px;

cursor:pointer;

}

button:hover{

background:#0b7dda;

}

p{

text-align:center;

margin-top:15px;

}

a{

cursor:pointer;

color:#2196f3;

}

display:none;

}

#message{

margin-top:15px;

text-align:center;

font-weight:bold;

color:green;

}



.blocked-timer-box{
    display:none;
    margin-top:14px;
    padding:16px;
    border-radius:16px;
    background:#fff7ed;
    border:2px solid #f97316;
    color:#9a3412;
    text-align:center;
    font-weight:700;
}
.blocked-timer{
    font-size:30px;
    letter-spacing:2px;
    margin-top:6px;
    color:#dc2626;
    font-variant-numeric:tabular-nums;
}
</style>

</head>

<body>

<div class="container">

    <h2>
        English Learning<a onclick="showSignup()" style="color: black;"> </a>App
    </h2>

        
<div id="loginForm">

<input type="text" id="loginMobile" placeholder="Mobile Number">

<input type="password" id="loginPassword" placeholder="Password">

<button onclick="login()">Login</button>

<button type="button" onclick="location.href='admin-login.html'" style="margin-top:10px;background:#111827;color:#fff;">🛡️ Admin Login</button>

<button id="aducate-install-app" type="button" style="margin-top:10px;background:#506ef0;color:#fff;border:0;border-radius:10px;padding:12px;width:100%;font-weight:800;cursor:pointer;">📲 Install Aducate App</button>

<p>

Don't have an account?

<a onclick="showSignup()">Signup</a>
</p>

</div>

<div id="signupForm">

<input type="text" id="signupName" placeholder="Full Name">

<input type="text" id="signupMobile" placeholder="Mobile Number">

<input type="password" id="signupPassword" placeholder="Password">

<button onclick="signup()">Create Account</button>

<p>

Already have an account?

<a onclick="showLogin()">Login</a>

</p>

</div>

<div id="message"></div>
<div id="blockedTimerBox" class="blocked-timer-box">
    🚫 Account Blocked<br>
    <span id="blockedTimerText">12:00:00</span>
    <div style="font-size:12px;font-weight:500;margin-top:5px;">Time remaining</div>
</div>
<div id="notificationGate" style="display:none;margin-top:12px;padding:12px;border-radius:10px;background:#fff7ed;color:#9a3412;font-size:13px;text-align:center;"></div>

</div>

<div id="notificationModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99999;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:390px;background:#fff;border-radius:22px;padding:26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);">
    <div style="font-size:48px;margin-bottom:8px;">🔔</div>
    <h3 style="margin-bottom:10px;color:#222;">Admin Notifications Enable કરો</h3>
    <p style="font-size:14px;line-height:1.6;color:#666;margin-bottom:20px;">
      Admin તરફથી આવતી મહત્વની notifications મેળવવા માટે Notifications <b>Allow</b> કરવી જરૂરી છે.
    </p>
    <button id="notificationAllowBtn" onclick="allowNotificationsAndContinue()" style="width:100%;padding:13px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:16px;font-weight:700;cursor:pointer;">
      🔔 Allow Notifications
    </button>
    <button onclick="denyNotificationsAndReturn()" style="width:100%;padding:11px;border:0;background:transparent;color:#777;font-size:14px;cursor:pointer;margin-top:6px;">
      Cancel / Deny
    </button>
    <div id="notificationModalMsg" style="font-size:13px;color:#dc2626;margin-top:10px;"></div>
  </div>
</div>

<script>

const API = "/api/auth";
let pendingLogin = null;

// One persistent ID per browser/device. The server still enforces the actual
// single active session using activeSessionId, while this ID identifies the device.
function getDeviceId(){
    let id = localStorage.getItem("studentDeviceId");
    if(!id){
        id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(36).slice(2)));
        localStorage.setItem("studentDeviceId", id);
    }
    return id;
}


function showSignup(){

document.getElementById("loginForm").style.display="none";

document.getElementById("signupForm").style.display="block";

document.getElementById("message").innerHTML="";

}

function showLogin(){

document.getElementById("signupForm").style.display="none";

document.getElementById("loginForm").style.display="block";

document.getElementById("message").innerHTML="";

}

async function signup(){

const name=document.getElementById("signupName").value;

const mobile=document.getElementById("signupMobile").value;

const password=document.getElementById("signupPassword").value;

const res=await fetch(API+"/signup",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

name,

mobile,

password

})

});

const data=await res.json();

document.getElementById("message").innerHTML=data.message;

if(data.success){

showLogin();

}

}

async function requestNotificationPermissionBeforeLogin(){

    if ("Notification" in window && Notification.permission === "granted") {
        return true;
    }

    if (!("Notification" in window)) {
        document.getElementById("message").innerHTML =
            "❌ આ browser notifications support કરતું નથી.";
        return false;
    }

    if (!window.isSecureContext) {
        document.getElementById("message").innerHTML =
            "❌ Notifications માટે HTTPS જરૂરી છે.";
        return false;
    }

    if (Notification.permission === "denied") {
        document.getElementById("message").innerHTML =
            "❌ Notifications Block છે. Browser site settings માં Notifications → Allow કરો અને ફરી Login કરો.";
        return false;
    }

    document.getElementById("notificationModal").style.display = "flex";
    document.getElementById("notificationModalMsg").innerHTML = "";
    return false;
}

async function allowNotificationsAndContinue(){

    const btn = document.getElementById("notificationAllowBtn");
    const msg = document.getElementById("notificationModalMsg");

    btn.disabled = true;
    btn.innerText = "Please wait...";
    msg.innerHTML = "";

    try {
        const permission = await Notification.requestPermission();

        if (permission === "granted") {
            document.getElementById("notificationModal").style.display = "none";

            // Continue the exact login that was waiting for permission.
            if (pendingLogin) {
                const credentials = pendingLogin;
                pendingLogin = null;
                await performLogin(credentials.mobile, credentials.password);
            }
        } else {
            // Deny = do not login. User must press Login again.
            pendingLogin = null;
            document.getElementById("notificationModal").style.display = "none";
            document.getElementById("loginMobile").value = "";
            document.getElementById("loginPassword").value = "";
            document.getElementById("message").innerHTML =
                "⚠️ Notifications Allow કર્યા વગર Login થઈ શકશે નહીં. ફરી Login કરો.";
        }
    } catch (error) {
        console.error("Notification permission error:", error);
        pendingLogin = null;
        document.getElementById("notificationModal").style.display = "none";
        document.getElementById("message").innerHTML =
            "❌ Notification permission મળી નથી. ફરી Login કરો.";
    } finally {
        btn.disabled = false;
        btn.innerText = "🔔 Allow Notifications";
    }
}

function denyNotificationsAndReturn(){
    pendingLogin = null;
    document.getElementById("notificationModal").style.display = "none";
    document.getElementById("loginMobile").value = "";
    document.getElementById("loginPassword").value = "";
    document.getElementById("message").innerHTML =
        "⚠️ Notifications Allow કર્યા વગર Login થઈ શકશે નહીં. ફરી Login કરો.";
}


async function login(){

    const mobile = document.getElementById("loginMobile").value.trim();
    const password = document.getElementById("loginPassword").value;

    if(!mobile || !password){
        document.getElementById("message").innerHTML =
            "Mobile Number અને Password નાખો.";
        return;
    }

    // If already granted, login directly. Otherwise show the permission popup.
    if ("Notification" in window && Notification.permission === "granted") {
        await performLogin(mobile, password);
        return;
    }

    if ("Notification" in window && Notification.permission === "denied") {
        document.getElementById("message").innerHTML =
            "❌ Notifications Block છે. Browser site settings માં Notifications → Allow કરો અને ફરી Login કરો.";
        return;
    }

    pendingLogin = { mobile, password };
    await requestNotificationPermissionBeforeLogin();
}


function loginBase64ToUint8Array(base64String){
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = window.atob(base64);
    return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
}

async function registerAdminPushSubscription(token){
    if (!window.isSecureContext || !("Notification" in window) ||
        !("serviceWorker" in navigator) || !("PushManager" in window)) {
        throw new Error("Admin notifications માટે આ browser/HTTPS જરૂરી છે.");
    }

    if (Notification.permission !== "granted") {
        throw new Error("Admin notifications permission Allow નથી.");
    }

    const registration = await navigator.serviceWorker.register("/sw.js", { scope: "/" });
    await navigator.serviceWorker.ready;

    const keyResponse = await fetch("/api/notifications/vapid-public-key", {
        headers: { Authorization: "Bearer " + token }
    });
    const keyData = await keyResponse.json();

    if (!keyResponse.ok || !keyData.success || !keyData.publicKey) {
        throw new Error(keyData.message || "Push notification server configuration missing.");
    }

    let subscription = await registration.pushManager.getSubscription();

    if (!subscription) {
        subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: loginBase64ToUint8Array(keyData.publicKey)
        });
    }

    const saveResponse = await fetch("/api/notifications/subscribe", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token
        },
        body: JSON.stringify(subscription.toJSON())
    });
    const saveData = await saveResponse.json();

    if (!saveResponse.ok || !saveData.success) {
        throw new Error(saveData.message || "Push subscription save failed.");
    }

    return true;
}

let blockedTimerInterval = null;

function startBlockedCountdown(remainingMs){
    const box = document.getElementById("blockedTimerBox");
    const timer = document.getElementById("blockedTimerText");
    if(!box || !timer) return;

    clearInterval(blockedTimerInterval);
    box.style.display = "block";

    // Server-provided remaining time is authoritative. This is the same
    // remainingMs derived from the user's canonical blockUntil used by Admin.
    let endTime = Date.now() + Math.max(0, Number(remainingMs || 0));

    function render(){
        const left = Math.max(0, endTime - Date.now());
        const totalSeconds = Math.floor(left / 1000);
        const h = String(Math.floor(totalSeconds / 3600)).padStart(2,"0");
        const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2,"0");
        const sec = String(totalSeconds % 60).padStart(2,"0");
        timer.textContent = h + ":" + m + ":" + sec;

        if(left <= 0){
            clearInterval(blockedTimerInterval);
            box.innerHTML = "✅ Block time completed. Please login again.";
        }
    }
    render();
    blockedTimerInterval = setInterval(render, 1000);
}

async function performLogin(mobile, password){

    const loginButton = document.querySelector('#loginForm button');
    if(loginButton){
        loginButton.disabled = true;
        loginButton.innerText = "Logging in...";
    }

    try{
        const res = await fetch(API+"/login",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "X-Device-ID": getDeviceId()
            },
            body:JSON.stringify({ mobile, password })
        });

        const data = await res.json();

        if(data.blocked){
            document.getElementById("message").innerHTML =
                "🚫 Account blocked.<br>" +
                "Block is active. નીચે actual remaining time દેખાશે.";
            startBlockedCountdown(data.remainingMs);
            if(loginButton){
                loginButton.disabled = false;
                loginButton.innerText = "Login";
            }
            return;
        }

        const timerBox = document.getElementById("blockedTimerBox");
        if(timerBox) timerBox.style.display = "none";

        if(data.success && data.token){
            // Save the real Web Push subscription BEFORE opening the dashboard.
            // Browser permission alone is not enough for Admin -> Student notifications.
            await registerAdminPushSubscription(data.token);

            localStorage.setItem("token", data.token);
            if(data.user) localStorage.setItem("user", JSON.stringify(data.user));

            window.location.replace("earn.html");
        }else{
            document.getElementById("message").innerHTML =
                data.message || "Invalid login details.";
            if(loginButton){
                loginButton.disabled = false;
                loginButton.innerText = "Login";
            }
        }
    }catch(error){
        console.error(error);
        document.getElementById("message").innerHTML =
            "❌ " + (error.message || "Login/notification setup failed.");
        if(loginButton){
            loginButton.disabled = false;
            loginButton.innerText = "Login";
        }
    }
}

</script>


<script>
(function(){
  let deferredPrompt=null;
  const btn=document.getElementById('aducate-install-app');
  if(!btn) return;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;});
  btn.addEventListener('click',async function(){
    if(deferredPrompt){
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt=null;
    }else{
      alert('જો Install popup ન આવે તો Chrome/Edge ના menu (⋮) માંથી “Install Aducate English App” પસંદ કરો. મોબાઇલમાં “Install app” અથવા “Add to Home screen” પસંદ કરો.');
    }
  });
  window.addEventListener('appinstalled',function(){deferredPrompt=null;btn.style.display='none';});
  window.addEventListener('load',function(){
    if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(console.error);
    if(window.matchMedia('(display-mode: standalone)').matches) btn.style.display='none';
  });
})();
</script>
</body>
</html>
